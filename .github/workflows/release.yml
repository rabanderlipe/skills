name: Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/*/.claude-plugin/plugin.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release bumped plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-plugins.sh "$GITHUB_SHA"
