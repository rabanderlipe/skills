name: Auto Assign Author
permissions:
  pull-requests: write
on:
  pull_request:
    types: [opened]
jobs:
  assign:
    if: github.actor != 'dependabot[bot]'

    name: Assign author to PR
    runs-on: ubuntu-latest
    steps:
      - name: Assign author to PR
        # CI-01: pinned to the v1.6.2 commit SHA, not the mutable tag — this
        # job holds a pull-requests:write token, so a hijacked tag would run
        # with it.
        uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
